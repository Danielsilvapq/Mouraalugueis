# Publica (ou atualiza) o Moura Aluguéis no servidor da Oracle, direto pelo GitHub.
# Para usar: aba Actions → "Publicar no servidor" → Run workflow.
# Precisa do secret ORACLE_SSH_KEY (chave privada de acesso ao servidor). Veja Manuais/Como colocar online.md
name: Publicar no servidor

on:
  workflow_dispatch:
    inputs:
      dominio:
        description: Domínio próprio (deixe vazio para usar o endereço grátis mouraalugueis.IP.sslip.io)
        default: ''
        required: false

concurrency: publicar-servidor

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IP: ${{ vars.SERVIDOR_IP }}
      USUARIO: ${{ vars.SERVIDOR_USUARIO || 'ubuntu' }}
      DOMINIO: ${{ inputs.dominio }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar a chave de acesso
        env:
          CHAVE: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          if [ -z "$IP" ]; then
            echo "::error::Falta cadastrar a variável SERVIDOR_IP com o IP do servidor (veja Manuais/Como colocar online.md)."
            exit 1
          fi
          [ -n "$DOMINIO" ] || DOMINIO="mouraalugueis.$IP.sslip.io"
          echo "DOMINIO=$DOMINIO" >> "$GITHUB_ENV"
          if [ -z "$CHAVE" ]; then
            echo "::error::Falta cadastrar a chave do servidor no secret ORACLE_SSH_KEY (veja Manuais/Como colocar online.md)."
            exit 1
          fi
          case "$DOMINIO" in *[!a-zA-Z0-9.-]*|"") echo "::error::Endereço inválido: $DOMINIO"; exit 1;; esac
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$CHAVE" | tr -d '\r' > ~/.ssh/servidor
          chmod 600 ~/.ssh/servidor
          ssh-keyscan -T 15 "$IP" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/servidor -o BatchMode=yes "$USUARIO@$IP" true \
            || { echo "::error::Não consegui entrar no servidor com essa chave."; exit 1; }

      - name: Enviar os arquivos
        run: |
          ssh -i ~/.ssh/servidor "$USUARIO@$IP" \
            'sudo mkdir -p /opt/mouraalugueis && (command -v rsync >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq rsync))'
          rsync -az --delete -e "ssh -i $HOME/.ssh/servidor" --rsync-path="sudo rsync" \
            --exclude 'servidor/dados' --exclude .git --exclude .github --exclude node_modules \
            --exclude '*.command' --exclude Manuais \
            ./ "$USUARIO@$IP:/opt/mouraalugueis/"

      - name: WhatsApp automático (só se os secrets existirem)
        env:
          WA_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WA_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
        run: |
          if [ -z "$WA_TOKEN" ] || [ -z "$WA_PHONE_ID" ]; then
            echo "WhatsApp automático ainda não configurado (faltam os secrets WHATSAPP_TOKEN e WHATSAPP_PHONE_ID). Seguindo sem ele."
            exit 0
          fi
          case "$WA_PHONE_ID" in *[!0-9]*) echo "::error::WHATSAPP_PHONE_ID deve ter só números."; exit 1;; esac
          # vai pela entrada padrão (não aparece em log nem na lista de processos do servidor)
          printf 'WHATSAPP_TOKEN=%s\nWHATSAPP_PHONE_ID=%s\n' "$WA_TOKEN" "$WA_PHONE_ID" | ssh -i ~/.ssh/servidor "$USUARIO@$IP" \
            'sudo sh -c "umask 077; cat > /etc/mouraalugueis-whatsapp.env"'
          echo "Token do WhatsApp enviado ao servidor."

      - name: Instalar no servidor
        run: ssh -i ~/.ssh/servidor "$USUARIO@$IP" "sudo bash /opt/mouraalugueis/servidor/deploy/instalar.sh '$DOMINIO'"

      - name: Resumo
        run: |
          echo "### Publicado: https://$DOMINIO" >> "$GITHUB_STEP_SUMMARY"
          echo "Na primeira publicação, o usuário \`admin\` e a senha inicial aparecem no passo **Instalar no servidor**. Troque a senha no primeiro acesso." >> "$GITHUB_STEP_SUMMARY"

      - name: Apagar a chave
        if: always()
        run: rm -f ~/.ssh/servidor
