<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moura Aluguéis</title>
<link rel="icon" href="assets/icone.svg" type="image/svg+xml">
<style>
:root{
  --bg:#F4F3F1;--card:#FFFFFF;--ink:#1B1A19;--mut:#6B6762;--line:#E4E1DC;--soft:#F7F6F4;
  --side:#17191C;--side-ink:#E9E7E3;--side-mut:#8D8A85;
  --pri:#E8590C;--pri-ink:#FFFFFF;--pri-soft:#FDEBDF;
  --ok:#2F855A;--ok-soft:#E3F3EA;--warn:#B7791F;--warn-soft:#FBF1DC;--bad:#C53030;--bad-soft:#FBE3E3;--info:#2B6CB0;--info-soft:#E2EDF8;
  --wa:#1FA855;--shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121315;--card:#1B1D20;--ink:#ECEAE6;--mut:#9C9893;--line:#2C2F33;--soft:#202327;
  --side:#0C0D0E;--side-ink:#E9E7E3;--side-mut:#7F7C77;
  --pri:#F07A35;--pri-ink:#16110D;--pri-soft:#3A2416;
  --ok:#5CC08A;--ok-soft:#1C3127;--warn:#E0B25A;--warn-soft:#3A2F17;--bad:#F07575;--bad-soft:#3D1F1F;--info:#7DB1E8;--info-soft:#1B2A3B;
  --wa:#3DCB74;--shadow:none;color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.marca{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.marca svg{flex:none}
.marca b{display:block;font-size:16px;letter-spacing:.2px}
.marca small{color:var(--side-mut);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--side-ink);font-size:14.5px}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button.on{background:var(--pri);color:#fff}
.nav button:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.nav .ct{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:11.5px;padding:1px 7px;font-weight:600}
.nav button.on .ct{background:#fff;color:var(--pri)}
.side .rod{margin-top:auto;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.08);font-size:13px;color:var(--side-mut)}
.side .rod b{color:var(--side-ink);display:block;font-weight:600}
.side .rod button{all:unset;cursor:pointer;color:var(--side-mut);text-decoration:underline;margin-right:10px;font-size:12.5px}
main{padding:24px 28px 60px;min-width:0;max-width:1240px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head h1{margin:0;font-size:24px;letter-spacing:-.3px}
.head p{margin:2px 0 0;color:var(--mut);font-size:14px}
.head .acoes{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:16px;display:flex;align-items:baseline;gap:4px 8px;flex-wrap:wrap}
.card h2 small{color:var(--mut);font-weight:400;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi span{color:var(--mut);font-size:13px;display:block}
.kpi b{font-size:22px;letter-spacing:-.3px;display:block;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--mut);font-size:12.5px}
.kpi.bad b{color:var(--bad)}.kpi.ok b{color:var(--ok)}.kpi.warn b{color:var(--warn)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid2>.card{margin-bottom:0}
.btn{border:1px solid transparent;background:var(--pri);color:var(--pri-ink);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{filter:brightness(1.05)}
.btn.sec{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.sec:hover{background:var(--soft)}
.btn.bad{background:var(--bad);color:#fff}
.btn.wa{background:var(--wa);color:#fff}
.btn.pq{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.lnk{all:unset;cursor:pointer;color:var(--pri);font-size:13.5px;font-weight:500}
.lnk:hover{text-decoration:underline}.lnk.bad{color:var(--bad)}
.lnk:focus-visible,.btn:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.tbl-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mut);font-weight:500;font-size:12.5px;text-transform:uppercase;letter-spacing:.3px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td small{display:block;color:var(--mut);font-size:12.5px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.nw{white-space:nowrap}
td.acts{text-align:right;white-space:nowrap}
td.acts>*+*{margin-left:12px}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12.5px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-info{background:var(--info-soft);color:var(--info)}.p-mut{background:var(--soft);color:var(--mut);border:1px solid var(--line)}.p-pri{background:var(--pri-soft);color:var(--pri)}
.vazio{color:var(--mut);text-align:center;padding:22px 8px;margin:0}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filtros input,.filtros select{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px;min-width:0}
.filtros input{flex:1 1 220px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:13.5px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mut{color:var(--mut)}
.lista{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block}
.item .tx small{color:var(--mut);font-size:13px}
.item .vl{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.item .bt{display:flex;gap:6px;flex:none}
.demo{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:13.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.demo button{all:unset;cursor:pointer;text-decoration:underline;font-weight:600}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,10,10,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow-y:auto}
.modal[hidden]{display:none}
.mbox{background:var(--card);border-radius:14px;width:100%;max-width:620px;box-shadow:0 10px 40px rgba(0,0,0,.25);border:1px solid var(--line)}
.mbox.larga{max-width:860px}
.mhd{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.mhd h3{margin:0;font-size:17px}
.mhd button{all:unset;cursor:pointer;font-size:22px;line-height:1;color:var(--mut);padding:0 4px}
.mbd{padding:16px 18px}
.mft{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px 16px;flex-wrap:wrap}
.merr{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);font-weight:500;min-width:0}
.form label.w{grid-column:1/-1}
.form input,.form select,.form textarea{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 10px;font-size:15px;color:var(--ink);width:100%;min-width:0}
.form textarea{min-height:120px;resize:vertical}
.form input:focus,.form select:focus,.form textarea:focus,.filtros input:focus,.filtros select:focus{outline:2px solid var(--pri);outline-offset:-1px;border-color:transparent}
.form .dica{grid-column:1/-1;font-size:13px;color:var(--mut);margin:-4px 0 0}
.form h4{grid-column:1/-1;margin:6px 0 -4px;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
.rede{position:fixed;top:0;left:0;right:0;background:var(--bad);color:#fff;text-align:center;padding:6px;font-size:13px;z-index:70}
.resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.resumo div{background:var(--soft);border-radius:10px;padding:10px 12px}
.resumo span{font-size:12.5px;color:var(--mut);display:block}
.resumo b{font-variant-numeric:tabular-nums}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--side)}
.login form{background:var(--card);border-radius:16px;padding:28px 24px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
.login h1{margin:6px 0 0;font-size:21px;text-align:center}
.login p{margin:0 0 6px;color:var(--mut);text-align:center;font-size:14px}
.login input{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px 12px;font-size:16px}
.login .btn{padding:11px}
.wa-ic{width:15px;height:15px;vertical-align:-3px;margin-right:4px;fill:currentColor}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;z-index:20;flex-direction:row;align-items:center;padding:8px 10px;gap:8px;overflow:hidden}
  .marca{padding:0 4px 0 0}.marca div{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;flex:1;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{padding:7px 10px;font-size:14px;white-space:nowrap}
  .side .rod{display:none}
  main{padding:16px 16px 60px}
  .grid2{grid-template-columns:1fr}
  .head h1{font-size:21px}
  .form{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi b{font-size:19px}
  .item{flex-wrap:wrap}
  .item .bt{width:100%;justify-content:flex-end}
  .modal{padding:12px}
  .conta{display:block!important}
}
.conta{display:none}
@media print{.side,.head .acoes,.demo,.filtros{display:none!important}.app{display:block}}
</style>
</head>
<body>
<div id="app"></div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mtit"></div>
<script>
'use strict';
/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const h=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=v=>{if(typeof v==='number')return v;const s=String(v||'').trim().replace(/[^\d,.-]/g,'');if(!s)return 0;return Number(s.includes(',')?s.replace(/\./g,'').replace(',','.'):s)||0};
const p2=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const dt=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)};
const hoje=()=>iso(new Date());
const addDias=(s,n)=>{const d=dt(s);d.setDate(d.getDate()+n);return iso(d)};
const addMeses=(s,n)=>{const d=dt(s),dia=d.getDate();const r=new Date(d.getFullYear(),d.getMonth()+n,1);r.setDate(Math.min(dia,new Date(r.getFullYear(),r.getMonth()+1,0).getDate()));return iso(r)};
const difDias=(a,b)=>Math.round((dt(b)-dt(a))/864e5); // b - a
const fdate=s=>{if(!s)return'—';const[y,m,d]=s.split('-');return`${d}/${m}/${y}`};
const fdc=s=>{if(!s)return'—';const[,m,d]=s.split('-');return`${d}/${m}`};
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const fmes=c=>{const[y,m]=c.split('-');return MESES[m-1]+' de '+y};
const uid=p=>p+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const digitos=s=>String(s||'').replace(/\D/g,'');
const fone=s=>{const d=digitos(s);if(d.length===11)return`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;if(d.length===10)return`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;return s||''};
const foneWa=s=>{let d=digitos(s);if(d.startsWith('0'))d=d.replace(/^0+/,'');if(d.length===10||d.length===11)d='55'+d;return d.length>=12?d:''};
const placaFmt=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/^([A-Z]{3})(\d[A-Z0-9]\d{2})$/,'$1-$2');
const WA_IC='<svg class="wa-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.7.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>';
const LOGO='<svg width="34" height="34" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#E8590C"/><circle cx="18" cy="42" r="8" fill="none" stroke="#fff" stroke-width="4"/><circle cx="47" cy="42" r="8" fill="none" stroke="#fff" stroke-width="4"/><path d="M18 42l9-14h11l9 14M30 28l-4-6h-5M38 28l4-8h6" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* ---------- dados ---------- */
const ONLINE=!!window.MA_ONLINE;
const KEY='moura-demo-v1';
const COLS=['motos','clientes','contratos','parcelas','manut','lanc','config'];
const FREQ={Semanal:7,Quinzenal:14,Mensal:0,Diária:1};
const TIPOS_MANUT=['Troca de óleo','Revisão','Pneu','Freio','Relação (corrente, coroa, pinhão)','Elétrica','Suspensão','Funilaria / carenagem','Documentação','Outro'];
const CAT_DESP=['IPVA / licenciamento','Seguro','Rastreador','Multa','Compra de moto','Peças (estoque)','Aluguel do espaço','Salários','Impostos','Outros'];
const CAT_REC=['Caução recebida','Venda de moto','Multa repassada','Outros'];
const CFG_PADRAO={id:'geral',empresa:'Moura Aluguéis',pix:'',diasAviso:2,multa:0,juros:0,formas:['Pix','Dinheiro','Cartão','Transferência'],
  msgAvencer:'Olá, {nome}! Aqui é da {empresa}. Passando para lembrar que a parcela {parcela} do aluguel da moto {moto} ({placa}), no valor de {valor}, vence {quando} ({vencimento}).{pix} Obrigado!',
  msgVencida:'Olá, {nome}! Aqui é da {empresa}. A parcela {parcela} do aluguel da moto {moto} ({placa}), no valor de {valor}, venceu em {vencimento} e está em atraso há {dias}. Por favor, regularize o pagamento o quanto antes.{pix} Se já pagou, desconsidere esta mensagem.'};
function vazio(){const o={};COLS.forEach(c=>o[c]=[]);return o}
function cfg(){return{...CFG_PADRAO,...(S.config.find(c=>c.id==='geral')||{})}}

function seed(){
  const d=vazio(),t=hoje();
  d.motos=[
    {id:'m1',placa:'QZA-1F23',marca:'Honda',modelo:'CG 160 Fan',ano:'2023',cor:'Preta',km:18450,renavam:'',chassi:'',status:'Disponível',obs:''},
    {id:'m2',placa:'QZB-4H56',marca:'Honda',modelo:'CG 160 Start',ano:'2022',cor:'Vermelha',km:27310,renavam:'',chassi:'',status:'Disponível',obs:''},
    {id:'m3',placa:'RAC-7J89',marca:'Yamaha',modelo:'Factor 150',ano:'2023',cor:'Azul',km:15020,renavam:'',chassi:'',status:'Disponível',obs:''},
    {id:'m4',placa:'RAD-2K34',marca:'Honda',modelo:'Pop 110i',ano:'2024',cor:'Branca',km:6840,renavam:'',chassi:'',status:'Disponível',obs:''},
    {id:'m5',placa:'QZE-5L67',marca:'Honda',modelo:'NXR 160 Bros',ano:'2022',cor:'Preta',km:33980,renavam:'',chassi:'',status:'Manutenção',obs:'Revisão do motor'},
    {id:'m6',placa:'RAF-8M90',marca:'Yamaha',modelo:'YBR 150 Factor',ano:'2021',cor:'Prata',km:41200,renavam:'',chassi:'',status:'Disponível',obs:''}];
  d.clientes=[
    {id:'c1',nome:'Carlos Henrique Souza',cpf:'123.456.789-00',fone:'92991234567',cnh:'01234567890',cnhCat:'A',cnhVal:addDias(t,420),nasc:'1994-03-12',end:'Rua das Flores, 120 — Cidade Nova',ref:'Maria (mãe) 92 99876-5432',obs:'Entregador iFood',ativo:true},
    {id:'c2',nome:'Juliana Martins',cpf:'987.654.321-00',fone:'92988887777',cnh:'09876543210',cnhCat:'AB',cnhVal:addDias(t,25),nasc:'1990-07-21',end:'Av. Torquato Tapajós, 3300',ref:'',obs:'',ativo:true},
    {id:'c3',nome:'Rafael Lima',cpf:'456.789.123-00',fone:'92977776666',cnh:'05556667778',cnhCat:'A',cnhVal:addDias(t,800),nasc:'1998-11-02',end:'Rua Rio Mar, 45 — Compensa',ref:'Jorge (irmão) 92 98123-4567',obs:'',ativo:true},
    {id:'c4',nome:'Diego Ferreira',cpf:'321.654.987-00',fone:'92966665555',cnh:'07778889990',cnhCat:'A',cnhVal:addDias(t,300),nasc:'1996-01-30',end:'Rua Itaúba, 18 — Jorge Teixeira',ref:'',obs:'Motoboy de farmácia',ativo:true}];
  d.contratos=[
    {id:'k1',clienteId:'c1',motoId:'m1',inicio:addDias(t,-61),primeiroVenc:addDias(t,-61),freq:'Semanal',valor:300,qtd:0,caucao:500,kmIni:15900,status:'Ativo',obs:''},
    {id:'k2',clienteId:'c2',motoId:'m3',inicio:addDias(t,-34),primeiroVenc:addDias(t,-34),freq:'Semanal',valor:320,qtd:52,caucao:500,kmIni:13800,status:'Ativo',obs:''},
    {id:'k3',clienteId:'c3',motoId:'m2',inicio:addDias(t,-90),primeiroVenc:addDias(t,-90),freq:'Quinzenal',valor:580,qtd:0,caucao:600,kmIni:23100,status:'Ativo',obs:''},
    {id:'k4',clienteId:'c4',motoId:'m4',inicio:addDias(t,-13),primeiroVenc:addDias(t,-13),freq:'Semanal',valor:280,qtd:0,caucao:400,kmIni:6100,status:'Ativo',obs:''}];
  S=d;gerarParcelas();
  // histórico de pagamentos do exemplo: quase tudo pago, com um atraso e um pagamento no dia
  S.parcelas.forEach(p=>{const atraso=difDias(p.venc,t);
    const deixa=(p.contratoId==='k2'&&atraso>=0&&atraso<8)||(p.contratoId==='k4'&&atraso>=0&&atraso<2)||atraso<0;
    if(!deixa){p.pago=true;p.dataPg=addDias(p.venc,p.contratoId==='k3'&&p.n===3?2:0);p.valorPago=p.valor;p.forma=p.n%3?'Pix':'Dinheiro'}});

function load(){try{const j=localStorage.getItem(KEY);if(j){const d=JSON.parse(j);if(d&&d.motos){COLS.forEach(c=>d[c]=d[c]||[]);return d}}}catch(e){}return seed()}

/* ---------- regras ---------- */
const moto=id=>S.motos.find(m=>m.id===id);
const cliente=id=>S.clientes.find(c=>c.id===id);
const contrato=id=>S.contratos.find(c=>c.id===id);
const contratoDaMoto=mid=>S.contratos.find(k=>k.motoId===mid&&k.status==='Ativo');
const statusMoto=m=>contratoDaMoto(m.id)?'Alugada':(m.status||'Disponível');
const motoNome=m=>m?`${m.marca} ${m.modelo}`.trim():'—';
function vencN(k,n){const b=k.primeiroVenc||k.inicio;if(k.freq==='Mensal')return addMeses(b,n-1);return addDias(b,(FREQ[k.freq]||7)*(n-1))}
// Cria as parcelas dos aluguéis ativos até 35 dias à frente. O código de cada parcela é fixo
// (aluguel + número), então duas pessoas usando ao mesmo tempo não criam parcelas repetidas.
function gerarParcelas(){const lim=addDias(hoje(),35);let mud=false;
  for(const k of S.contratos){if(k.status!=='Ativo')continue;
    for(let n=1;n<5000;n++){if(k.qtd&&n>k.qtd)break;const v=vencN(k,n);if(v>lim)break;
      const id='p-'+k.id+'-'+n;if(S.parcelas.some(p=>p.id===id))continue;
      S.parcelas.push({id,contratoId:k.id,n,venc:v,valor:k.valor,pago:false,dataPg:'',valorPago:0,forma:'',avisos:[]});mud=true}}
  return mud}
function encargos(p){const at=difDias(p.venc,hoje());if(p.pago||at<=0)return 0;const c=cfg();return Math.round((p.valor*(num(c.multa)/100)+p.valor*(num(c.juros)/100)*at)*100)/100}
const devido=p=>p.valor+encargos(p);
function situacao(p){if(p.pago)return'paga';const d=difDias(hoje(),p.venc);if(d<0)return'vencida';if(d===0)return'hoje';if(d<=num(cfg().diasAviso))return'avencer';return'futura'}
const SIT={paga:['Paga','p-ok'],vencida:['Vencida','p-bad'],hoje:['Vence hoje','p-warn'],avencer:['A vencer','p-warn'],futura:['Em aberto','p-mut']};
const pillSit=p=>{const s=situacao(p),[t,c]=SIT[s];let x=t;if(s==='vencida'){const d=difDias(p.venc,hoje());x+=` · ${d} dia${d>1?'s':''}`}else if(s==='avencer'){const d=difDias(hoje(),p.venc);x=d===1?'Vence amanhã':`Vence em ${d} dias`}return`<span class="pill ${c}">${x}</span>`};
const parcelasAbertas=()=>S.parcelas.filter(p=>!p.pago&&contrato(p.contratoId));
const avisadoHoje=p=>(p.avisos||[]).some(a=>a.data===hoje());
const totalParc=k=>k.qtd?`${k.qtd}x`:'sem prazo';
function cnhSit(c){if(!c.cnhVal)return null;const d=difDias(hoje(),c.cnhVal);if(d<0)return['CNH vencida','p-bad'];if(d<=30)return['CNH vence em '+d+' dia'+(d===1?'':'s'),'p-warn'];return null}
function manutAlertas(){const out=[];const t=hoje();
  for(const m of S.motos){if(statusMoto(m)==='Inativa'||statusMoto(m)==='Vendida')continue;
    const us=S.manut.filter(u=>u.motoId===m.id);
    // só a manutenção mais recente de cada tipo vale como "próxima"
    const porTipo={};us.forEach(u=>{if(!porTipo[u.tipo]||u.data>porTipo[u.tipo].data)porTipo[u.tipo]=u});
    for(const u of Object.values(porTipo)){
      if(u.proxData){const d=difDias(t,u.proxData);if(d<=7)out.push({m,u,txt:d<0?`${u.tipo} atrasada (era ${fdate(u.proxData)})`:d===0?`${u.tipo} hoje`:`${u.tipo} em ${d} dia${d>1?'s':''} (${fdc(u.proxData)})`,grave:d<0})}
      if(num(u.proxKm)){const f=num(u.proxKm)-num(m.km);if(f<=300)out.push({m,u,txt:f<=0?`${u.tipo}: passou ${Math.abs(f).toLocaleString('pt-BR')} km do previsto`:`${u.tipo} em ${f.toLocaleString('pt-BR')} km`,grave:f<=0})}}}
  return out.sort((a,b)=>b.grave-a.grave)}

function msgParcela(p){const k=contrato(p.contratoId),c=cliente(k.clienteId),m=moto(k.motoId),g=cfg();
  const s=situacao(p),d=difDias(hoje(),p.venc),at=-d;
  const quando=d===0?'hoje':d===1?'amanhã':`em ${d} dias`;
  const tx=(s==='vencida'?g.msgVencida:g.msgAvencer)||'';
  const tot=k.qtd?`${p.n}/${k.qtd}`:`nº ${p.n}`;
  const rep={nome:(c?c.nome:'').split(' ')[0],nome_completo:c?c.nome:'',empresa:g.empresa,parcela:tot,moto:motoNome(m),placa:m?m.placa:'',valor:brl(devido(p)),
    vencimento:fdate(p.venc),quando,dias:`${at} dia${at===1?'':'s'}`,pix:g.pix?` Chave Pix: ${g.pix}.`:''};
  return tx.replace(/\{(\w+)\}/g,(x,n)=>n in rep?rep[n]:x)}
function whatsParcela(pid){const p=S.parcelas.find(x=>x.id===pid),k=contrato(p.contratoId),c=cliente(k.clienteId);

    p.avisos=[...(p.avisos||[]),{data:hoje(),tipo:situacao(p)}];save();setTimeout(()=>{fecharModal();render();toast('Aviso registrado')},300)}}
function whatsCliente(cid){const c=cliente(cid),nro=foneWa(c.fone);if(!nro){toast('Celular inválido no cadastro');return}

/* ---------- modal, formulários e avisos ---------- */
let acaoModal=null;
function abrirModal(tit,corpo,ok,okTxt='Salvar',larga=false,perigo=false,extra=''){
  const m=$('#modal');acaoModal=ok;
  m.innerHTML=`<div class="mbox${larga?' larga':''}"><div class="mhd"><h3 id="mtit">${tit}</h3><button type="button" aria-label="Fechar" onclick="fecharModal()">×</button></div>
  <form id="mform" novalidate><div class="mbd"><div class="merr" id="merr" hidden></div>${corpo}</div>
  <div class="mft"><button type="button" class="btn sec" onclick="fecharModal()">${ok?'Cancelar':'Fechar'}</button>${extra}${ok?`<button class="btn${perigo?' bad':''}" type="submit">${okTxt}</button>`:''}</div></form></div>`;
  m.hidden=false;
  $('#mform').onsubmit=e=>{e.preventDefault();if(acaoModal&&acaoModal()!==false)fecharModal()};
  const f=m.querySelector('input:not([type=hidden]),select,textarea');if(f&&ok)setTimeout(()=>f.focus(),30)}
function fecharModal(){const m=$('#modal');m.hidden=true;m.innerHTML='';acaoModal=null;if(atrasoRender){atrasoRender=false;render()}}
function erroModal(t){const e=$('#merr');if(e){e.textContent=t;e.hidden=false;e.scrollIntoView({block:'nearest'})}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)fecharModal()});
$('#modal').addEventListener('mousedown',e=>{if(e.target.id==='modal')fecharModal()});
function campos(fs){return`<div class="form">${fs.map(f=>{
  if(f.t==='h4')return`<h4>${h(f.l)}</h4>`;if(f.t==='dica')return`<p class="dica">${f.l}</p>`;
  const id='f_'+f.k,req=f.req?' required':'',v=f.v??'';let inp;
  if(f.t==='select')inp=`<select id="${id}"${req}>${f.o.map(o=>{const[val,tx]=Array.isArray(o)?o:[o,o];return`<option value="${h(val)}"${String(val)===String(v)?' selected':''}>${h(tx)}</option>`}).join('')}</select>`;
  else if(f.t==='area')inp=`<textarea id="${id}"${req}>${h(v)}</textarea>`;
  else inp=`<input id="${id}" type="${f.t==='money'?'text':f.t||'text'}"${f.t==='money'?' inputmode="decimal"':''}${f.t==='number'?' inputmode="numeric"':''} value="${h(f.t==='money'&&v!==''?String(v).replace('.',','):v)}"${f.ph?` placeholder="${h(f.ph)}"`:''}${req}${f.max?` maxlength="${f.max}"`:''}>`;
  return`<label class="${f.w?'w':''}">${h(f.l)}${f.req?' *':''}${inp}</label>`}).join('')}</div>`}
function ler(fs){const d={};for(const f of fs){if(!f.k)continue;const el=$('#f_'+f.k);let v=el.value.trim();
  if(f.req&&!v){erroModal(`Preencha: ${f.l}`);el.focus();return null}
  if(f.t==='money'||f.t==='number')v=num(v);d[f.k]=v}return d}
let toastT;function toast(t){let n=$('.toast');if(!n){n=document.createElement('div');n.className='toast';n.setAttribute('role','status');document.body.appendChild(n)}
  n.textContent=t;n.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>n.hidden=true,2800)}

/* ---------- cobranças / parcelas ---------- */
function vCobrancas(){

  const sit=p=>situacao(p);
  if(f==='pendentes')ps=ps.filter(p=>['vencida','hoje','avencer'].includes(sit(p)));
  else if(f==='vencidas')ps=ps.filter(p=>sit(p)==='vencida');
  else if(f==='abertas')ps=ps.filter(p=>!p.pago);
  else if(f==='pagas')ps=ps.filter(p=>p.pago&&(p.dataPg||'').startsWith(F.mes));
  if(b)ps=ps.filter(p=>{const k=contrato(p.contratoId),c=cliente(k.clienteId),m=moto(k.motoId);return((c?c.nome:'')+' '+(m?m.placa+' '+m.modelo:'')).toLowerCase().includes(b)});
  ps.sort((a,b2)=>f==='pagas'?(b2.dataPg||'').localeCompare(a.dataPg||''):a.venc.localeCompare(b2.venc));
  const tot=ps.reduce((s,p)=>s+(p.pago?num(p.valorPago||p.valor):devido(p)),0);
  const chips=[['pendentes','Para cobrar'],['vencidas','Vencidas'],['abertas','Todas em aberto'],['pagas','Pagas no mês']];
  return head('Cobranças','Parcelas dos aluguéis. Avise pelo WhatsApp e registre o pagamento.')+
  `<section class="card"><div class="filtros"><div class="chips">${chips.map(([k,t])=>`<button class="chip${f===k?' on':''}" onclick="F.cob='${k}';render()">${t}</button>`).join('')}</div>

    <div id="lst"><p class="mut" style="margin:0 0 8px;font-size:13.5px">${ps.length} parcela${ps.length===1?'':'s'} · total ${brl(tot)}</p>

function formContrato(id){
  const k=id?contrato(id):{clienteId:'',motoId:'',inicio:hoje(),primeiroVenc:hoje(),freq:'Semanal',valor:'',qtd:0,caucao:'',kmIni:'',obs:''};
  const clis=S.clientes.filter(c=>c.ativo!==false||c.id===k.clienteId).sort((a,b)=>a.nome.localeCompare(b.nome));
  const motos=S.motos.filter(m=>m.id===k.motoId||statusMoto(m)==='Disponível');
  if(!id&&!clis.length){toast('Cadastre um cliente primeiro');ir('clientes');return}
  if(!id&&!motos.length){toast('Nenhuma moto disponível no momento');return}
  const temPg=id&&S.parcelas.some(p=>p.contratoId===id&&p.pago);
  const fs=[{k:'clienteId',l:'Cliente',t:'select',req:1,o:[['','Escolha…'],...clis.map(c=>[c.id,c.nome])],v:k.clienteId},
    {k:'motoId',l:'Moto',t:'select',req:1,o:[['','Escolha…'],...motos.map(m=>[m.id,`${m.placa} · ${motoNome(m)}`])],v:k.motoId},
    {k:'inicio',l:'Data de retirada',t:'date',req:1,v:k.inicio},{k:'kmIni',l:'KM na retirada',t:'number',v:k.kmIni},
    {t:'h4',l:'Parcelas'},
    {k:'valor',l:'Valor da parcela (R$)',t:'money',req:1,v:k.valor},{k:'freq',l:'Frequência',t:'select',o:Object.keys(FREQ),v:k.freq},
    {k:'primeiroVenc',l:'1º vencimento',t:'date',req:1,v:k.primeiroVenc||k.inicio},{k:'qtd',l:'Quantidade de parcelas (0 = sem prazo)',t:'number',v:k.qtd||0},
    ...(temPg?[{t:'dica',l:'Mudar o valor atualiza só as parcelas em aberto que ainda não venceram.'}]:[]),
    {k:'caucao',l:'Caução (R$)',t:'money',v:k.caucao},{k:'obs',l:'Observações',v:k.obs,w:1}];
  abrirModal(id?'Editar aluguel':'Novo aluguel',campos(fs),()=>{const d=ler(fs);if(!d)return false;
    if(d.valor<=0){erroModal('Informe o valor da parcela.');return false}
    if(d.primeiroVenc<d.inicio){erroModal('O 1º vencimento não pode ser antes da retirada.');return false}
    const outro=S.contratos.find(x=>x.id!==id&&x.status==='Ativo'&&x.motoId===d.motoId);if(outro){erroModal('Essa moto já está em outro aluguel ativo.');return false}
    d.qtd=Math.max(0,Math.round(d.qtd));
    if(id){const muda=k.freq!==d.freq||k.primeiroVenc!==d.primeiroVenc;
      if(muda&&temPg){erroModal('Este aluguel já tem parcelas pagas. Para mudar a frequência ou o 1º vencimento, encerre este aluguel e crie um novo.');return false}
      Object.assign(k,d);
      // sem nada pago, o calendário pode mudar à vontade: as parcelas em aberto são refeitas
      if(muda)S.parcelas=S.parcelas.filter(p=>!(p.contratoId===id&&!p.pago));
      // parcelas além da nova quantidade saem; as em aberto que ainda não venceram seguem o novo valor
      S.parcelas=S.parcelas.filter(p=>!(p.contratoId===id&&!p.pago&&d.qtd&&p.n>d.qtd));
      S.parcelas.forEach(p=>{if(p.contratoId===id&&!p.pago&&p.venc>=hoje())p.valor=d.valor});
      const m=moto(d.motoId);if(m&&num(d.kmIni)>num(m.km))m.km=num(d.kmIni);
      gerarParcelas();commit('Aluguel atualizado')}
    else{const nk={id:uid('k'),...d,status:'Ativo',fim:''};S.contratos.push(nk);const m=moto(d.motoId);if(m){if(num(d.kmIni)>num(m.km))m.km=num(d.kmIni);m.status='Disponível'}
      gerarParcelas();commit('Aluguel criado — parcelas geradas')}},id?'Salvar':'Criar aluguel')}

    ${k.obs?`<p class="mut" style="margin:0 0 12px">${h(k.obs)}</p>`:''}
    ${ps.length?`<div class="tbl-wrap"><table style="min-width:520px"><thead><tr><th>Nº</th><th>Vencimento</th><th class="num">Valor</th><th>Situação</th><th></th></tr></thead><tbody>

    </tbody></table></div>`:'<p class="vazio">Ainda sem parcelas.</p>'}`,null,'',true,false,
    k.status==='Ativo'?`<button type="button" class="btn sec" onclick="encerrar('${k.id}')">Encerrar aluguel</button>`:`<button type="button" class="btn sec" onclick="apagarContrato('${k.id}')">Apagar</button>`)}
function encerrar(id){const k=contrato(id),m=moto(k.motoId);

function formMoto(id){const m=id?moto(id):{placa:'',marca:'Honda',modelo:'',ano:'',cor:'',km:'',renavam:'',chassi:'',status:'Disponível',obs:'',valorCompra:'',dataCompra:''};

function apagarMoto(id){const m=moto(id);if(S.contratos.some(k=>k.motoId===id)){toast('Esta moto tem aluguéis no histórico. Marque como Inativa ou Vendida.');return}

function verMoto(id){const m=moto(id),ks=S.contratos.filter(k=>k.motoId===id).sort((a,b)=>b.inicio.localeCompare(a.inicio)),us=S.manut.filter(u=>u.motoId===id).sort((a,b)=>b.data.localeCompare(a.data));

/* ---------- modo online (servidor próprio) ---------- */
// Cada moto, cliente, parcela etc. é um registro no servidor. A tela guarda a última versão
// recebida de cada um (BASE) e envia só o que mudou; a cada 10 s busca o que outras pessoas alteraram.
let BASE={},VER=0,syncing=false,pendente=false,carregado=!ONLINE,atrasoRender=false;
async function api(m,url,body){
  const r=await fetch(url,{method:m,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,credentials:'same-origin'});
  let j={};try{j=await r.json()}catch(e){}
  if(r.status===401&&url!=='/api/login'&&url!=='/api/me'){U=null;carregado=false;fecharModal();render();throw new Error(j.erro||'Faça login novamente')}
  if(!r.ok)throw new Error(j.erro||'Erro '+r.status);return j}
function rede(ok){let n=$('#rede');if(!n){n=document.createElement('div');n.id='rede';n.className='rede';n.setAttribute('role','status');document.body.appendChild(n)}
  n.textContent='Sem conexão com o servidor. As alterações serão enviadas quando a internet voltar.';n.hidden=ok}
function aplicar(itens){let mud=false;
  for(const it of itens){const arr=S[it.c];if(!arr)continue;const b=BASE[it.c]||(BASE[it.c]={});
    const i=arr.findIndex(x=>x.id===it.id),local=i>=0?JSON.stringify(arr[i]):null,sujo=local!==(b[it.id]??null);
    if(it.apagado)delete b[it.id];else b[it.id]=JSON.stringify(it.dados);
    if(sujo)continue; // alteração local ainda não enviada: ela vale
    if(it.apagado){if(i>=0){arr.splice(i,1);mud=true}}
    else if(i>=0){if(local!==b[it.id]){arr[i]=it.dados;mud=true}}else{arr.push(it.dados);mud=true}}
  return mud}
function mudancas(){const o=[];
  for(const c of COLS){const b=BASE[c]||(BASE[c]={}),vistos=new Set();
    for(const x of S[c]||[]){vistos.add(x.id);const js=JSON.stringify(x);if(b[x.id]!==js)o.push({c,id:x.id,dados:x,js})}
    for(const id in b)if(!vistos.has(id))o.push({c,id,apagar:true})}
  return o}
async function enviar(){
  if(!ONLINE||!U||!carregado)return;if(syncing){pendente=true;return}
  const o=mudancas();if(!o.length)return;syncing=true;
  try{const r=await api('POST','/api/sync',{ops:o.map(({js,...x})=>x)});
    for(const x of o){if(x.apagar)delete BASE[x.c][x.id];else BASE[x.c][x.id]=x.js}
    rede(true);
    if(r.recusados){toast('Algumas alterações não foram salvas porque o seu acesso não permite.');syncing=false;return carregar()}
    await puxar();
  }catch(e){rede(false)}
  finally{syncing=false;if(pendente){pendente=false;enviar()}}}
function podeRender(){const a=document.activeElement;return $('#modal').hidden&&!(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)&&a.closest('#app'))}
async function puxar(){
  if(!ONLINE||!U||!carregado)return;
  try{const r=await api('GET','/api/estado?desde='+VER);VER=r.versao;rede(true);
    if(aplicar(r.itens)){if(podeRender())render();else atrasoRender=true}
    if(mudancas().length)enviar()}catch(e){if(U)rede(false)}}
async function carregar(){
  S=vazio();BASE={};COLS.forEach(c=>BASE[c]={});VER=0;carregado=false;
  const r=await api('GET','/api/estado?desde=0');VER=r.versao;aplicar(r.itens);carregado=true;
  gerarParcelas();render();enviar()}
function telaLogin(){return`<div class="login"><form onsubmit="entrarOnline(event)">
  <div style="text-align:center">${LOGO.replace('width="34" height="34"','width="56" height="56"')}</div><h1>Moura Aluguéis</h1><p>Entre com seu usuário e senha</p>
  <div class="merr" id="lg_err" hidden></div>
  <input id="lg_u" autocomplete="username" placeholder="Usuário" aria-label="Usuário" required autocapitalize="none">
  <input id="lg_s" type="password" autocomplete="current-password" placeholder="Senha" aria-label="Senha" required>
  <button class="btn" type="submit">Entrar</button></form></div>`}
async function entrarOnline(e){e.preventDefault();const er=$('#lg_err'),bt=e.target.querySelector('button[type=submit]');er.hidden=true;bt.disabled=true;
  try{U=await api('POST','/api/login',{login:$('#lg_u').value.trim(),senha:$('#lg_s').value});render();await carregar()}
  catch(x){U=null;render();const e2=$('#lg_err');if(e2){e2.textContent=x.message;e2.hidden=false}}finally{bt.disabled=false}}
async function sairOnline(){try{await api('POST','/api/logout')}catch(e){}U=null;carregado=false;S=vazio();BASE={};render()}
function minhaSenha(){
  const fs=[{k:'atual',l:'Senha atual',t:'password',req:1,w:1},{k:'nova',l:'Nova senha (mínimo 6 caracteres)',t:'password',req:1},{k:'conf',l:'Repita a nova senha',t:'password',req:1}];
  abrirModal('Minha senha',campos(fs),()=>{const d=ler(fs);if(!d)return false;
    if(d.nova!==d.conf){erroModal('As duas senhas novas não são iguais.');return false}
    api('POST','/api/me/senha',{atual:d.atual,nova:d.nova}).then(()=>{fecharModal();toast('Senha alterada')}).catch(x=>erroModal(x.message));return false},'Trocar senha')}
let USUARIOS=null;
const perfilNome=p=>p==='admin'?'Administrador':'Equipe';
function vAcessos(){
  setTimeout(carregarUsuarios);
  return head('Acessos','Quem pode entrar no sistema',`<button class="btn" onclick="formUsuario()">+ Novo acesso</button>`)+
  `<section class="card"><div id="usrTbl">${USUARIOS?tblUsuarios():'<p class="vazio">Carregando…</p>'}</div></section>
  <p class="mut" style="margin:0;font-size:13px">Administrador vê tudo. Equipe cuida de motos, clientes, aluguéis, cobranças e manutenção, mas não vê o financeiro, as configurações nem os acessos.</p>`}
async function carregarUsuarios(){try{USUARIOS=await api('GET','/api/usuarios');const t=$('#usrTbl');if(t)t.innerHTML=tblUsuarios()}catch(e){toast(e.message)}}
function tblUsuarios(){
  return`<div class="tbl-wrap"><table style="min-width:520px"><thead><tr><th>Nome</th><th>Usuário</th><th>Perfil</th><th>Situação</th><th></th></tr></thead><tbody>
  ${USUARIOS.map(u=>`<tr><td><b>${h(u.nome)}</b>${u.id===U.id?'<small>você</small>':''}</td><td class="nw">${h(u.login)}</td><td>${perfilNome(u.perfil)}</td>
    <td><span class="pill ${u.ativo?'p-ok':'p-mut'}">${u.ativo?'Ativo':'Inativo'}</span></td><td class="acts"><button class="lnk" onclick="formUsuario(${u.id})">Editar</button></td></tr>`).join('')}</tbody></table></div>`}
function formUsuario(id){
  const u=id?USUARIOS.find(x=>x.id===id):{nome:'',login:'',perfil:'equipe',ativo:1};
  const fs=[{k:'nome',l:'Nome',req:1,v:u.nome,w:1},
    ...(id?[]:[{k:'login',l:'Usuário (para entrar)',req:1,v:'',ph:'ex.: joao'}]),
    {k:'perfil',l:'Perfil',t:'select',o:[['equipe','Equipe'],['admin','Administrador']],v:u.perfil},
    ...(id?[{k:'ativo',l:'Situação',t:'select',o:[['1','Ativo'],['0','Inativo (não consegue entrar)']],v:String(u.ativo)}]:[]),
    {k:'senha',l:id?'Nova senha (deixe vazio para manter)':'Senha (mínimo 6 caracteres)',t:'password',req:!id,v:''}];
  abrirModal(id?'Editar acesso':'Novo acesso',campos(fs),()=>{const d=ler(fs);if(!d)return false;
    const req=id?api('PUT','/api/usuarios/'+id,{nome:d.nome,perfil:d.perfil,ativo:d.ativo==='1',senha:d.senha||undefined}):api('POST','/api/usuarios',d);
    req.then(()=>{fecharModal();toast(id?'Acesso atualizado':'Acesso criado para '+d.nome);carregarUsuarios()}).catch(x=>erroModal(x.message));return false},id?'Salvar':'Criar acesso')}

/* ---------- início ---------- */
if(ONLINE){
  api('GET','/api/me').then(u=>{U=u;render();return carregar()}).catch(()=>{U=null;render()});
  setInterval(puxar,10000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)puxar()});
  // vira o dia com o sistema aberto: gera as parcelas novas
  setInterval(()=>{if(carregado&&gerarParcelas()){save();if(podeRender())render()}},3600e3);
}else{if(gerarParcelas())save()}
render();
</script>
</body>
</html>
